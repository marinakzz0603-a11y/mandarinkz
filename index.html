<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ebedf0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор SMM-метрик</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ebedf0;--plaque:#dde0e5;--ink:#12151c;--muted:#5d6572;--navy:#2b4bb5;--panel:#a9aeb8;--line:#c3c8d1;--warn:#9a5b00;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 32px}
h1{color:var(--navy);font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
h2{font-size:15px;color:var(--navy);margin:24px 0 10px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{padding:14px;border-radius:24px;background:var(--panel)}
.panel label{color:#20262f}
label{display:block;font-size:13px;color:var(--muted)}
.wide{grid-column:1/-1}
input{width:100%;margin-top:4px;padding:11px 14px;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:999px}
input:focus-visible{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(43,75,181,.28)}
button:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{position:relative;background:var(--plaque);border-radius:22px;padding:14px}
.m .ic{font-size:20px;margin-right:6px;vertical-align:1px}
.empty{grid-column:1/-1;color:var(--muted);margin:0;padding:6px 2px}
.m .n{display:inline-block;padding:3px 10px;border:1.5px solid var(--navy);border-radius:999px;background:#fff;color:var(--navy);font-size:12px;font-weight:600}
.m .v{white-space:nowrap;font-size:clamp(20px,6vw,26px);font-weight:800;color:var(--navy);line-height:1.2;margin-top:10px}
.m .h{font-size:12px;color:var(--muted);margin-top:4px}
#sum{background:var(--navy);color:#fff;font-size:15px;line-height:1.55}
#sum .h{color:#d8dff5}
.warn{color:var(--warn);font-size:13px;margin:10px 0 0}
button{margin-top:18px;width:100%;padding:14px;font-size:16px;font-weight:700;border:0;border-radius:999px;background:var(--navy);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--navy);border:1.5px solid var(--navy);margin-top:10px}
.foot{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:330px){.grid,.res{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<h1>Калькулятор <span style="white-space:nowrap">SMM-метрик</span></h1>
<p class="sub">Введите цифры за период и сразу получите ER, CTR, CPL и ROMI с пояснениями.</p>
<h2>Данные</h2>
<div class="grid panel">
<label>Охват<input id="reach" inputmode="decimal" placeholder="10000"></label>
<label>Подписчики<input id="subs" inputmode="decimal" placeholder="5000"></label>
<label class="wide">Взаимодействия: лайки, комментарии, сохранения, репосты<input id="eng" inputmode="decimal" placeholder="800"></label>
<label>Клики по ссылке<input id="clicks" inputmode="decimal" placeholder="300"></label>
<label>Заявки<input id="leads" inputmode="decimal" placeholder="15"></label>
<label>Затраты, ₽<input id="cost" inputmode="decimal" placeholder="30000"></label>
<label>Выручка, ₽<input id="rev" inputmode="decimal" placeholder="90000"></label>
</div>
<p class="warn" id="warn" role="status"></p>
<h2>Вывод</h2>
<div class="m" id="sum"></div>
<h2>Результаты</h2>
<div class="res" id="out" aria-live="polite"></div>
<button id="copy" type="button">Копировать результат</button>
<button id="clear" type="button" class="ghost">Очистить данные</button>
<p class="foot">Блог про SMM: @mandarinkz</p>
</main>
<script>
var EM={'ER по охвату':'❤️','ER по подписчикам':'👥','CTR по охвату':'👆','Конверсия в заявку':'✅','CPL':'💰','CPC':'🖱️','CPM':'👁️','ROMI':'📈'};
var P=function(x){return x.toLocaleString('ru-RU',{maximumFractionDigits:2})+' %'};
var R=function(x){return x.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽'};
var M=[
['ER по охвату','heart',function(d){return d.eng/d.reach*100},P,['reach','eng'],'Какая доля увидевших отреагировала'],
['ER по подписчикам','users',function(d){return d.eng/d.subs*100},P,['subs','eng'],'Насколько активна ваша база'],
['CTR по охвату','cur',function(d){return d.clicks/d.reach*100},P,['reach','clicks'],'Сколько увидевших перешло по ссылке'],
['Конверсия в заявку','ok',function(d){return d.leads/d.clicks*100},P,['clicks','leads'],'Сколько кликнувших оставило заявку'],
['CPL','coin',function(d){return d.cost/d.leads},R,['cost','leads'],'Цена одной заявки'],
['CPC','cur',function(d){return d.cost/d.clicks},R,['cost','clicks'],'Цена одного клика'],
['CPM','eye',function(d){return d.cost/d.reach*1000},R,['cost','reach'],'Цена 1000 показанных пользователей'],
['ROMI','up',function(d){return (d.rev-d.cost)/d.cost*100},P,['rev','cost'],'0 % означает «вышли в ноль»']
];
var ids=['reach','subs','eng','clicks','leads','cost','rev'],out=document.getElementById('out'),last=[];
var neg=false,DEN={'ER по охвату':'reach','ER по подписчикам':'subs','CTR по охвату':'reach','Конверсия в заявку':'clicks','CPL':'leads','CPC':'clicks','CPM':'reach','ROMI':'cost'};
function read(){var d={};neg=false;ids.forEach(function(k){var v=parseFloat(document.getElementById(k).value.replace(/[\s\u00a0\u202f]/g,'').replace(',','.'));if(v<0){neg=true;v=NaN}d[k]=isNaN(v)?null:v});return d}
function warn(d){var w=[];if(neg)w.push('Числа не могут быть отрицательными.');
if(d.leads!==null&&d.clicks!==null&&d.leads>d.clicks)w.push('Заявок больше, чем кликов.');
if(d.clicks!==null&&d.reach!==null&&d.clicks>d.reach)w.push('Кликов больше охвата.');
if(d.eng!==null&&d.reach!==null&&d.eng>d.reach)w.push('Взаимодействий больше охвата.');
document.getElementById('warn').textContent=w.length?'Проверьте цифры: '+w.join(' '):''}
function save(){try{var o={};ids.forEach(function(k){o[k]=document.getElementById(k).value});localStorage.setItem('smmcalc.v1',JSON.stringify(o))}catch(e){}}
function restore(){try{var o=JSON.parse(localStorage.getItem('smmcalc.v1')||'{}');ids.forEach(function(k){if(o[k])document.getElementById(k).value=o[k]})}catch(e){}}
function calc(){var d=read();warn(d);save();last=[];var val={};out.innerHTML='';if(ids.every(function(k){return d[k]===null})){out.innerHTML='<p class="empty">Введите данные, и здесь появятся метрики.</p>';concl(val);return d}M.forEach(function(m){
var ok=m[4].every(function(k){return d[k]!==null})&&d[DEN[m[0]]]!==0;
if(m[0]==='ROMI')ok=d.rev!==null&&d.cost!==null&&d.cost!==0;
var v=ok?m[3](m[2](d)):'—';if(ok){last.push(m[0]+': '+v);val[m[0]]=m[2](d)}
var el=document.createElement('div');el.className='m';
el.innerHTML='<div class="n">'+m[0]+'</div><div class="v"><span class="ic" aria-hidden="true">'+EM[m[0]]+'</span>'+v+'</div><div class="h">'+m[5]+'</div>';out.appendChild(el)});
concl(val);return d}
function concl(v){var t=[],f=function(x){return x.toLocaleString('ru-RU',{maximumFractionDigits:1})},r=v['ROMI'];
if(r!==undefined)t.push(r<0?'Затраты пока выше выручки: ROMI '+f(r)+' %. Начните с цены заявки и конверсии в продажу.':r===0?'Вы вышли в ноль: ROMI 0 %.':'Реклама окупилась: ROMI '+f(r)+' %.');
var c=v['Конверсия в заявку'],k=v['CTR по охвату'],e=v['ER по охвату'];
if(c!==undefined&&c<2)t.push('Слабое звено: конверсия в заявку ('+f(c)+' %). Проверьте оффер и страницу, на которую ведёт ссылка.');
else if(k!==undefined&&k<1)t.push('Мало переходов по ссылке (CTR '+f(k)+' %). Усильте призыв к действию и сделайте ссылку заметнее.');
else if(e!==undefined&&e<1)t.push('Вовлечённость низкая (ER '+f(e)+' %). Поработайте над первым кадром или заголовком.');
else if(c!==undefined||k!==undefined||e!==undefined)t.push('Воронка выглядит ровно: явного слабого звена по введённым данным нет.');
if(v['CPL']!==undefined)t.push('Одна заявка обходится в '+f(v['CPL'])+' ₽.');
var el=document.getElementById('sum');
if(!t.length){el.textContent='Введите данные, и здесь появится вывод.';return}
el.innerHTML=t.join(' ')+'<div class="h">Ориентиры условные: зависят от ниши и площадки.</div>';
last.push('Вывод: '+t.join(' '))}
ids.forEach(function(k){document.getElementById(k).addEventListener('input',calc)});
restore();calc();
document.getElementById('copy').addEventListener('click',function(){
var b=this,t=last.length?last.join('\n'):'Нет данных для расчёта';
function done(){try{tg.HapticFeedback.notificationOccurred('success')}catch(e){}b.textContent='Скопировано';setTimeout(function(){b.textContent='Копировать результат'},1500)}
try{navigator.clipboard.writeText(t).then(done,function(){fb()})}catch(e){fb()}
function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(a)}});
document.getElementById('clear').addEventListener('click',function(){try{tg.HapticFeedback.impactOccurred('light')}catch(e){}ids.forEach(function(k){document.getElementById(k).value=''});calc();try{localStorage.removeItem('smmcalc.v1')}catch(e){}});
var tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#ebedf0');tg.setBackgroundColor('#ebedf0')}catch(e){}}
</script>
</body>
</html>
